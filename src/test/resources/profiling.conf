<?xml version="1.0" encoding="UTF-8"?>
<!-- Profiling mode: never blocks, only reports -->
<config>
  <refresh>6000</refresh>
  <mode>
    <profiling>true</profiling>
  </mode>
  <blacklist>
    <regexps>
        <regexp>.*</regexp>
    </regexps>
  </blacklist>
  <whitelist>
  </whitelist>
</config>
